<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>aws-prod-hl fixture</title>
  <style>
    #awsc-top-level-nav {
      background-color: #232f3e;
      color: #fff;
      padding: 12px 16px;
      font: 14px/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="awsc-top-level-nav">
    <span data-testid="account-label">fixture-prod (1234-5678-9012)</span>
  </div>
  <pre id="status"></pre>
  <script>
    const CONFIG = { PRODUCTION_ACCOUNT_IDS: ['123456789012'] };
  </script>
  <script src="../content.js"></script>
  <script>
    const root = document.documentElement;
    const status = document.getElementById('status');
    const label = document.querySelector('span[data-testid="account-label"]');
    const lines = [];

    function report(step, ok, detail) {
      lines.push(`${ok ? 'PASS' : 'FAIL'} ${step}${detail ? ' — ' + detail : ''}`);
      status.textContent = lines.join('\n');
      if (!ok) document.title = 'FAIL';
    }

    report(
      'hyphenated prod paints via data-aws-prod',
      root.getAttribute('data-aws-prod') === '123456789012',
      String(root.getAttribute('data-aws-prod')),
    );

    label.textContent = 'fixture-prod (123456789012)';
    report(
      'plain digits stay prod without churn',
      root.getAttribute('data-aws-prod') === '123456789012',
      String(root.getAttribute('data-aws-prod')),
    );

    label.textContent = 'fixture-dev (999999999999)';
    setTimeout(() => {
      report(
        'nonprod clears data-aws-prod',
        !root.hasAttribute('data-aws-prod'),
        String(root.getAttribute('data-aws-prod')),
      );
      if (!document.title.startsWith('FAIL')) document.title = 'PASS';
    }, 100);
  </script>
</body>
</html>
