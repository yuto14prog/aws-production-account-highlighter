<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>本番アカウントID</title>
  <style>
    body {
      font: 16px/1.5 system-ui, sans-serif;
      margin: 24px;
      max-width: 36rem;
    }
    label {
      display: block;
      margin-bottom: 8px;
    }
    textarea {
      box-sizing: border-box;
      font: 14px/1.4 ui-monospace, monospace;
      width: 100%;
    }
    button {
      margin-top: 12px;
    }
    #status {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <label for="ids">本番アカウントID（1行に1つ）</label>
  <textarea id="ids" rows="8" spellcheck="false" placeholder="123456789012&#10;1234-5678-9012"></textarea>
  <button id="save" type="button" disabled>保存</button>
  <p id="status" role="status"></p>
  <script src="account-ids.js"></script>
  <script src="options.js"></script>
</body>
</html>
